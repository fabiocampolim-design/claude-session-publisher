name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    # No TeX on the runners: the LaTeX/PDF compile checks skip themselves and
    # everything else runs on the standard library alone.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_archiver.py
