name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    # No TeX on the runners: the LaTeX/PDF compile checks skip themselves and
    # everything else runs on the standard library alone.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Static check (pyflakes)
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes .
      - name: Run the suite (stdlib only)
        run: python tests/test_archiver.py
      # The vendored-checker wiring test never ran on any runner until
      # 2.7.7: its byte-identity half skips without the owner's private
      # rules file, but the half that runs the checker works anywhere, and
      # the drift it catches was red locally while CI stayed green.
      - name: Run the remaining test files
        run: python -m unittest discover -s tests
