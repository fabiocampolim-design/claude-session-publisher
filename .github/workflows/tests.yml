name: tests

on:
  push:
  pull_request:

jobs:
  suite:
    # No TeX on the runners: the LaTeX/PDF compile checks skip themselves and
    # everything else runs on the standard library alone.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Static check (pyflakes)
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes transcript_archiver.py tests docs examples
      - name: Run the suite (stdlib only)
        run: python tests/test_archiver.py
